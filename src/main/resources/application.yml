server:
  port: 8087

spring:
  application:
    name: spring-statemachine-showcase

logging:
  file:
    name: logs/application.log
  logback:
    rollingpolicy:
      file-name-pattern: logs/archive/application.%d{yyyy-MM-dd}.%i.log.gz
      max-file-size: 10MB
      max-history: 14
      total-size-cap: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
